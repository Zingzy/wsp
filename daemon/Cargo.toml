# SPDX-License-Identifier: AGPL-3.0-only
[workspace]
resolver = "2"
members = ["crates/wsp-frames", "crates/wsp-runtime", "crates/wsp-daemon", "crates/wsp-daemon-bin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "sync", "fs", "process"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
subtle = "2"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
