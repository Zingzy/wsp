[package]
name = "wsp-guest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The wsp a process inside a machine runs: one session on that machine's own daemon, carried to the host"

[dependencies]
wsp-frames = { path = "../wsp-frames" }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[dev-dependencies]
tempfile = "3"
wsp-daemon = { path = "../wsp-daemon" }
