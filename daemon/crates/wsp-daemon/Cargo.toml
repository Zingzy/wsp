[package]
name = "wsp-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The daemon server: the door every socket passes, and the op switch behind it"

[dependencies]
wsp-frames = { path = "../wsp-frames" }
wsp-runtime = { path = "../wsp-runtime" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
subtle.workspace = true
base64.workspace = true
portable-pty = "0.9"
nix = { version = "0.31", default-features = false, features = ["signal", "user", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
