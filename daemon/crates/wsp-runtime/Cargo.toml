[package]
name = "wsp-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The workspace manager behind the machine ops on a place link: the layer store and the registry fetch; every machine op still refused until a backend exists"

[dependencies]
wsp-frames = { path = "../wsp-frames" }
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", features = ["xattr"] }

[dev-dependencies]
tempfile = "3"
