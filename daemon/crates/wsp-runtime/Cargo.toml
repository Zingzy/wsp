[package]
name = "wsp-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The workspace manager behind the machine ops on a place link: the layer store, the registry fetch, and the workspaces youki's library runs from them"

[dependencies]
wsp-frames = { path = "../wsp-frames" }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", features = ["xattr"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
libcontainer = { version = "0.7.0", default-features = false, features = ["v2", "libseccomp"] }
libcgroups = { version = "0.7.0", default-features = false, features = ["v2"] }
nix = { version = "0.31", default-features = false, features = ["fs", "mount", "process", "sched", "signal", "user"] }
xattr = "1"
netlink-sys = "0.8"
netlink-packet-core = "0.8"
netlink-packet-route = "0.31"

[dev-dependencies]
tempfile = "3"
xattr = "1"
