<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>wsp</title>
    <!-- The web app's own stylesheet, so every colour, radius and face here is the app's token; stage.mjs writes the built file's name. -->
    <link rel="stylesheet" href="__WEB_CSS__" />
    <style>
      html { color-scheme: light dark; }
      html.dark { color-scheme: dark; }
      html:not(.dark) { color-scheme: light; }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        color: var(--foreground);
        font: 14px/1.5 var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      /* The app's stylesheet leaves html and body clear under the desktop's class so the sidebar shows the window's
         glass; this page has no glass to show, so its ground is painted here, flat, in the app's token. */
      .ground { position: fixed; inset: 0; background: var(--background); z-index: -1; }

      /* ---- the screen: cloud-setup/SetupScreen.tsx, at its numbers ---- */
      .setup { margin: 0 auto; display: flex; height: 100%; width: 560px; max-width: 100%; flex-direction: column; align-items: center; }
      /* Two flex items sharing what the bands leave, so the screen stands centred and each stops at its least. */
      .margin { flex: 1 1 0; min-height: 48px; width: 100%; }
      .margin.bottom { min-height: 40px; }
      .head { margin-bottom: 64px; display: flex; width: 100%; flex: none; flex-direction: column; align-items: center; }
      .content { display: flex; width: 100%; min-height: 0; flex-direction: column; }
      .foot { position: relative; display: flex; width: 100%; flex: none; flex-direction: column; align-items: center; padding-top: 56px; }
      h1 { margin: 0; width: 100%; text-align: center; font: 600 34px/1.15 var(--font-sans); letter-spacing: -0.02em; }
      .sentence { margin: 16px 0 0; max-width: 440px; text-align: center; font-size: 15px; line-height: 1.5; color: var(--muted-foreground); }

      .hero { display: grid; place-items: center; margin-bottom: 28px; }
      /* The mark's 12.8 units across at 250 px is a tilde 200 px wide; the box is cropped to the stroke's own rows. */
      .tilde { width: 250px; height: 156px; overflow: visible; color: var(--foreground); }
      /* Lit from above, as the Mac draws the app icon: the body flat in the ink, one thin light along the top edge and
         one thin shade along the bottom, each cut from the stroke's own outline moved 0.3 units, so a vertical run
         carries neither and nothing shades across the body. */
      .tilde .body { stroke-width: 2.6; stroke-dasharray: 22; }
      .tilde .lit { flood-color: light-dark(color-mix(in oklab, var(--color-white) 75%, transparent), var(--color-white)); }
      .tilde .shade { flood-color: light-dark(var(--color-neutral-950), var(--background)); flood-opacity: 0.4; }
      /* One entrance, from CSS so it plays before any script: the tilde draws itself, its top edge lights, the words,
         the card and the footer rise, all inside 0.8 s; nothing plays after. */
      @keyframes draw { from { stroke-dashoffset: 22; } }
      @keyframes light { from { flood-opacity: 0; } }
      @keyframes rise { from { opacity: 0; translate: 0 12px; } }
      .tilde .body, .tilde .lit, h1, .sentence, .content, .foot {
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        animation-fill-mode: backwards;
      }
      .tilde .body { animation-name: draw; animation-duration: 0.42s; }
      .tilde .lit { animation-name: light; animation-duration: 0.22s; animation-delay: 0.3s; }
      h1 { animation-name: rise; animation-duration: 0.34s; animation-delay: 0.26s; }
      .sentence { animation-name: rise; animation-duration: 0.34s; animation-delay: 0.34s; }
      .content { animation-name: rise; animation-duration: 0.34s; animation-delay: 0.42s; }
      .foot { animation-name: rise; animation-duration: 0.34s; animation-delay: 0.46s; }
      @media (prefers-reduced-motion: reduce) {
        .tilde .body, .tilde .lit, h1, .sentence, .content, .foot { animation: none; }
      }

      /* ---- the card and its one row: cloud-setup/rows.tsx CARD, ROW, NAME, Slot, STATE_WORD ---- */
      .card { width: 100%; overflow: hidden; border-radius: 10px; border: 1px solid var(--border); background: var(--card); text-align: left; }
      .row { display: flex; height: 48px; align-items: center; gap: 12px; padding: 0 10px 0 16px; cursor: pointer; transition: background-color 150ms; }
      .row:hover { background: color-mix(in oklab, var(--accent) 40%, transparent); }
      .row:has(input:disabled) { cursor: default; background: none; }
      .name { min-width: 0; flex: 1 0 auto; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; color: var(--foreground); }
      .row:has(input:disabled) .name { color: var(--muted-foreground); }
      .slot { margin-left: auto; display: flex; min-width: 96px; flex: 0 1 auto; align-items: center; justify-content: flex-end; }
      .state { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px/1.5 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted-foreground); }
      /* One row of its own height before the scan answers: the line is empty until then, and a column that recentres
         under the words arriving is the one thing this screen must not do. */
      .hint { margin: 12px 0 0; min-height: 19.5px; text-align: center; font-size: 13px; line-height: 1.5; color: var(--muted-foreground); }

      /* ---- components/ui/checkbox.tsx: the box in the input hairline, the tick drawn by the indicator over the accent ---- */
      .check { appearance: none; margin: 0; width: 16px; height: 16px; flex: none; display: grid; place-items: center; border: 1px solid var(--input); border-radius: 0.25rem; background: var(--background); cursor: inherit; }
      .check:checked { background: var(--primary); border-color: var(--primary); }
      .check:checked::after { content: ""; width: 4px; height: 8px; margin-top: -2px; border: solid var(--primary-foreground); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
      .check:disabled { opacity: 0.64; }

      /* ---- components/ui/button.tsx: the default variant at the setup keycap's size, and the link ---- */
      .primary {
        position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        height: 40px; border-radius: 10px; padding: 0 22px; border: 1px solid var(--primary);
        font: 500 15px/1.5 var(--font-sans); white-space: nowrap; cursor: pointer;
        background: var(--primary); color: var(--primary-foreground);
        box-shadow: inset 0 1px color-mix(in oklab, var(--color-white) 16%, transparent), 0 1px 2px color-mix(in oklab, var(--primary) 24%, transparent);
        transition: box-shadow 150ms, background-color 150ms;
      }
      .primary:hover { background: color-mix(in oklab, var(--primary) 90%, transparent); }
      .primary:disabled { opacity: 0.64; pointer-events: none; }
      .links { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
      .link { height: auto; padding: 0; border: 0; background: none; font: 15px/1.5 var(--font-sans); color: var(--muted-foreground); cursor: pointer; transition: color 150ms; }
      .link:hover { color: var(--foreground); }
      :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

      /* The refusal slot, SetupScreen's own: inside the footer's 56 px gap, out of the flow at 18 px from its top, so
         it stands two lines tall and its arrival moves neither the head, the card nor the keycap. What happened in the
         destructive ink, then what to do in the foreground ink; every refusal here is written to fit two lines at
         560 px, so nothing is ever cut. */
      .refusal { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); margin: 0; width: 560px; max-width: 100%; min-height: 36px; text-align: center; font: 12px/18px var(--font-mono); color: var(--destructive-foreground); overflow-wrap: anywhere; }
      .refusal .fix { color: var(--foreground); }
    </style>
  </head>
  <body>
    <div class="ground" aria-hidden="true"></div>
    <div class="setup">
      <div class="margin" aria-hidden="true"></div>
      <div class="head">
        <div class="hero">
          <!-- A copy of apps/web/src/brand/mark.svg, which the desktop brand test pins it to; the band its outline
               leaves bare when moved down is the top edge, moved up the bottom. -->
          <svg class="tilde" viewBox="0 3 16 10" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round">
            <defs>
              <!-- The region is the box, not the path's own: a percentage of a 4.5 unit tall geometry cuts the stroke's rows. -->
              <filter id="edges" filterUnits="userSpaceOnUse" x="-1" y="2" width="18" height="12">
                <feOffset in="SourceAlpha" dy="0.3" result="down" />
                <feComposite in="SourceAlpha" in2="down" operator="out" result="top" />
                <feFlood class="lit" result="light" />
                <feComposite in="light" in2="top" operator="in" result="rim" />
                <feOffset in="SourceAlpha" dy="-0.3" result="up" />
                <feComposite in="SourceAlpha" in2="up" operator="out" result="bottom" />
                <feFlood class="shade" result="ink" />
                <feComposite in="ink" in2="bottom" operator="in" result="under" />
                <feMerge><feMergeNode in="SourceGraphic" /><feMergeNode in="rim" /><feMergeNode in="under" /></feMerge>
              </filter>
            </defs>
            <g class="body" filter="url(#edges)"><path d="M1.6 8A3.4 3.4 0 0 1 8 8A3.4 3.4 0 0 0 14.4 8" /></g>
          </svg>
        </div>
        <h1>Welcome to wsp</h1>
        <p class="sentence">Your agents work on this Mac, in threads you can leave running.</p>
      </div>
      <div class="content">
        <div class="card">
          <label class="row" id="row">
            <input class="check" id="tools" type="checkbox" checked />
            <span class="name">Give your agents here the wsp tools</span>
            <span class="slot"><span class="state" id="slot"></span></span>
          </label>
        </div>
        <p class="hint" id="line"></p>
      </div>
      <div class="foot">
        <p class="refusal" id="status"></p>
        <button id="open" type="button" class="primary">Open wsp <span aria-hidden="true">→</span></button>
        <div class="links"><button id="join" type="button" class="link">This Mac joins another wsp</button></div>
      </div>
      <div class="margin bottom" aria-hidden="true"></div>
    </div>
    <script>
      const $ = id => document.getElementById(id);
      /** The row's slot and the line under it on a computer the scan found no agent on. */
      const NONE = { slot: "no agents found on this Mac", line: "Agents installed later get the tools from Settings, then Agents." };
      /** Each refusal in two halves, what happened and what to do, both written to fit the slot's two lines at 560 px.
       * The shell's own words are never drawn: they are unbounded and would run past the slot into the keycap, so they
       * ride on the slot's title where the whole of one can be read. */
      const REFUSALS = {
        unread: { happened: "The agents on this Mac could not be read.", fix: "Press Open wsp to read them again." },
        tools: { fix: "Take the tick off to open wsp without them, or fix the config and press again." },
        shell: { happened: "wsp could not open on this Mac.", fix: "Press Open wsp again." },
      };
      const text = e => String(e && e.message ? e.message : e).replace(/^.*Error: /, "");

      // The app's stylesheet has two sides told apart by the dark class; this page follows the computer's, with
      // transitions held off for one frame across a flip, as the app does.
      const html = document.documentElement;
      const scheme = window.matchMedia("(prefers-color-scheme: dark)");
      const follow = () => {
        html.classList.add("no-transitions");
        html.classList.toggle("dark", scheme.matches);
        requestAnimationFrame(() => html.classList.remove("no-transitions"));
      };
      follow();
      scheme.addEventListener("change", follow);

      /** Names in a sentence: one, two joined by and, more with commas before the and. */
      const list = names => (names.length < 3 ? names.join(" and ") : `${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}`);
      /** The same, capped for a refusal: three names whole, and past that the first two and how many more, so the
       * sentence holds the slot's two lines however many of the catalog's agents refused at once. */
      const capped = names => (names.length <= 3 ? list(names) : `${names[0]}, ${names[1]} and ${names.length - 2} more`);

      /** Draws one refusal in the slot: what happened in the destructive ink, then what to do in the foreground ink,
       * with the shell's own words, where there are any, on the title. */
      function refuse(happened, fix, said) {
        const what = document.createElement("span");
        what.className = "fix";
        what.textContent = fix;
        $("status").replaceChildren(`${happened} `, what);
        if (said === undefined) $("status").removeAttribute("title");
        else $("status").title = said;
      }

      function clearRefusal() {
        $("status").replaceChildren();
        $("status").removeAttribute("title");
      }

      /** The agents the recipe scan found on this computer, in the catalog's order. Nothing else is ticked or named:
       * the row means the tools go into these, so a name here is one the scan answered with. */
      let found = [];
      /** Whether the last scan refused. A computer whose agents could not be read is not a computer with none, so
       * nothing is recorded off an empty list: the reason stands and the next press reads again. */
      let unread = false;

      function draw() {
        const some = found.length > 0;
        $("tools").checked = some;
        $("tools").disabled = !some;
        $("slot").textContent = some ? found.map(a => a.id).join(" · ") : NONE.slot;
        $("line").textContent = some ? `Lets ${list(found.map(a => a.name))} open threads and workspaces on this Mac.` : NONE.line;
      }

      async function scan() {
        try {
          found = (await window.wsp.agents()).filter(a => a.found);
          unread = false;
          clearRefusal();
          draw();
        } catch (e) {
          // Not "no agents found on this Mac": that is a fact about the computer, and this scan learned none.
          found = [];
          unread = true;
          $("tools").checked = false;
          $("tools").disabled = true;
          $("slot").textContent = "";
          $("line").textContent = "";
          refuse(REFUSALS.unread.happened, REFUSALS.unread.fix, text(e));
        }
      }

      // The scan runs as the page opens, not behind a press: it is the one thing on this screen a person reads before
      // deciding.
      let reading = scan();

      /** The one press: the tools into every agent the scan found, then this computer recorded and the app opened on
       * it. A config that refused says which and stays here, so the tick can come off and the press go again. */
      async function openWsp() {
        $("open").disabled = true;
        let leaving = false;
        try {
          await reading;
          if (unread) {
            reading = scan();
            await reading;
            if (unread) return;
          }
          clearRefusal();
          if ($("tools").checked && found.length > 0) {
            const report = await window.wsp.install(found.map(a => a.id));
            if (report.failures.length > 0) {
              const names = report.failures.map(f => found.find(a => a.id === f.id)?.name ?? f.id);
              const happened = names.length === 1 ? `${names[0]}'s config would not take the wsp tools.` : `${capped(names)} would not take the wsp tools.`;
              refuse(happened, REFUSALS.tools.fix, report.failures.map(f => `${f.id}: ${f.error}`).join("\n"));
              return;
            }
          }
          leaving = true;
          await window.wsp.finish();
        } catch (e) {
          leaving = false;
          refuse(REFUSALS.shell.happened, REFUSALS.shell.fix, text(e));
        } finally {
          if (!leaving) $("open").disabled = false;
        }
      }

      /** The way out for a person whose wsp runs on another computer: this Mac is recorded all the same, and the app
       * opens on the road that joins it to one. */
      async function joinAnother() {
        $("join").disabled = true;
        $("open").disabled = true;
        try {
          await window.wsp.connect();
        } catch (e) {
          refuse(REFUSALS.shell.happened, REFUSALS.shell.fix, text(e));
          $("join").disabled = false;
          $("open").disabled = false;
        }
      }

      $("open").addEventListener("click", openWsp);
      $("join").addEventListener("click", joinAnother);
      // Nothing is focused for the person: Enter is answered here, and a ring shows only where the keyboard put it.
      document.addEventListener("keydown", e => {
        if (e.key !== "Enter" || e.target instanceof HTMLButtonElement || e.target instanceof HTMLInputElement) return;
        void openWsp();
      });
    </script>
  </body>
</html>
