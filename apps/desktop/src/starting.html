<!doctype html>

<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>wsp</title>
    <!-- The web app's own stylesheet, so the ground and the words take the app's tokens; stage.mjs writes the built file's name. -->
    <link rel="stylesheet" href="__WEB_CSS__" />
    <style>
      /* Dark, as the app's window opens before its page reads the person's preference. */
      html { color-scheme: dark; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--muted-foreground);
        font: 14px/1.5 var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      body::before { content: ""; position: fixed; inset: 0 0 auto; height: var(--workspace-topbar-height); -webkit-app-region: drag; }
      .starting { display: flex; align-items: center; gap: 8px; }
      /* The app's Spinner: lucide's loader-circle, turning. */
      .spinner { width: 16px; height: 16px; animation: spin 1s linear infinite; }
      @keyframes spin { to { rotate: 360deg; } }
    </style>
  </head>
  <body>
    <div class="starting" role="status">
      <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
      <span>Starting wsp</span>
    </div>
  </body>
</html>
