appId: wsp.desktop
productName: wsp
electronVersion: 43.5.1
directories:
  app: build/app
  output: dist
asar: false
npmRebuild: false
files:
  - main/**
  - web/**
  - package.json
extraResources:
  - from: build/app/node_modules/@wsp/daemon
    to: node_modules/@wsp/daemon
afterPack: scripts/after-pack.mjs
mac:
  target:
    - target: dir
      arch: [arm64, x64]
  # No identity is named: a Developer ID Application certificate in the keychain (CSC_LINK imports one) signs, and
  # without one electron-builder skips signing and scripts/after-pack.mjs signs ad hoc.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Runs only after an identity signed, and only with APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID set.
  notarize: true
  category: public.app-category.developer-tools
  icon: build/icon.icns
win:
  icon: build/icon.ico
linux:
  target:
    - target: AppImage
      arch: [x64]
