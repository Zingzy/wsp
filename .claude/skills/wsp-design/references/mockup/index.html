<!doctype html>
<html lang="en" class="dark" data-theme="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wsp screens on the new nouns</title>
<script src="assets.js"></script>
<script src="crab.js"></script>
<style>
/* The locked mockup of the wsp app on the new nouns, 2026-09-26. Static fake data, the app's own tokens.
   Tokens copied from apps/web/src/themes/graphite.css, paper.css and index.css on main. The agent marks and the
   lucide paths come from assets.js, read off packages/catalog and node_modules. */

[data-theme="graphite"] {
  color-scheme: dark;
  --background: oklch(14.5% 0 none);
  --foreground: oklch(97% 0 none);
  --card: color-mix(in srgb, var(--background) 97%, #fff);
  --surface-raised: color-mix(in srgb, var(--background) 97%, #fff);
  --muted-foreground: color-mix(in srgb, oklch(55.6% 0 none) 90%, #fff);
  --accent: color-mix(in oklab, #fff 4%, transparent);
  --primary: oklch(0.571 0.21 264);
  --primary-foreground: #fff;
  --border: color-mix(in srgb, #fff 10%, var(--background));
  --input: color-mix(in oklab, #fff 8%, transparent);
  --input-fill: color-mix(in oklab, #fff 2.5%, transparent);
  --error-foreground: oklch(70.4% 0.191 22.216);
  --success: oklch(69.6% 0.17 162.48);
  --warning: oklch(76.9% 0.188 70.08);
  --sidebar: #000;
  --sidebar-foreground: #f1f3f7;
  --sidebar-muted-foreground: #a3a3a3;
  --sidebar-whisper: var(--sidebar-muted-foreground);
  --sidebar-row-rest: color-mix(in oklab, var(--sidebar-muted-foreground) 80%, transparent);
  --sidebar-row-hover: color-mix(in srgb, var(--sidebar-foreground) 4%, transparent);
  --sidebar-row-selected: color-mix(in srgb, var(--sidebar-foreground) 7%, transparent);
  --sidebar-row-edge: transparent;
  --sidebar-rail: rgb(255 255 255 / 16%);
  --sidebar-border: var(--border);
  --composer-outline: color-mix(in srgb, #fff 5%, transparent);
  --composer-highlight: rgb(255 255 255 / 3%);
  --composer-shadow: none;
  --strip-edge: rgb(255 255 255 / 7%);
  --strip-fill: linear-gradient(to bottom, transparent 0 1rem, rgb(0 0 0 / 18%) 1rem, transparent calc(1rem + 10px)), linear-gradient(rgb(255 255 255 / 1%), rgb(255 255 255 / 1%));
  --keycap-top: rgb(255 255 255 / 6%);
  --popover-edge: color-mix(in srgb, var(--foreground) 10%, transparent);
  --popover-shadow: 0 12px 32px -12px rgb(0 0 0 / 45%), 0 2px 6px -2px rgb(0 0 0 / 25%);
  --dialog-shadow: inset 0 1px rgb(255 255 255 / 4%), 0 24px 72px -20px rgb(0 0 0 / 90%);
  --project-hue: oklch(78% 0.13 185);
  --hue-orange: oklch(70.5% 0.213 47.604);
  --status-input: #a3b3ff;
  --status-working: #f472b6;
  --status-failed: #ffa2a2;
  --status-done: #5ee9b5;
}
[data-theme="paper"] {
  color-scheme: light;
  --background: oklch(99.2% 0 0);
  --foreground: oklch(27.4% 0.006 286.033);
  --card: #fff;
  --surface-raised: #fff;
  --muted-foreground: oklch(53.5% 0.016 285.938);
  --accent: oklch(96.7% 0.001 286.375);
  --primary: oklch(0.488 0.217 264);
  --primary-foreground: #fff;
  --border: oklch(92% 0.004 286.32);
  --input: oklch(87.1% 0.006 286.286);
  --input-fill: #fff;
  --error-foreground: oklch(50.5% 0.213 27.518);
  --success: oklch(59.6% 0.145 163.225);
  --warning: oklch(66.6% 0.179 58.318);
  --sidebar: oklch(98.5% 0 none);
  --sidebar-foreground: var(--foreground);
  --sidebar-muted-foreground: oklch(44.2% 0.017 285.786);
  --sidebar-whisper: oklch(37% 0.013 285.805);
  --sidebar-row-rest: var(--sidebar-muted-foreground);
  --sidebar-row-hover: oklch(99.2% 0 0);
  --sidebar-row-selected: oklch(96.7% 0.001 286.375);
  --sidebar-row-edge: color-mix(in srgb, var(--foreground) 10%, transparent);
  --sidebar-rail: rgb(0 0 0 / 16%);
  --sidebar-border: var(--border);
  --composer-outline: rgb(0 0 0 / 8%);
  --composer-highlight: transparent;
  --composer-shadow: 0 12px 28px -18px rgb(0 0 0 / 40%);
  --strip-edge: rgb(0 0 0 / 8%);
  --strip-fill: none;
  --keycap-top: rgb(255 255 255 / 60%);
  --popover-edge: color-mix(in srgb, var(--foreground) 10%, transparent);
  --popover-shadow: 0 12px 32px -12px rgb(0 0 0 / 18%), 0 2px 6px -2px rgb(0 0 0 / 10%);
  --dialog-shadow: 0 24px 64px -24px rgb(0 0 0 / 35%);
  --project-hue: oklch(55% 0.12 185);
  --hue-orange: oklch(70.5% 0.213 47.604);
  --status-input: #4f39f6;
  --status-working: #be185d;
  --status-failed: #c10007;
  --status-done: #007a55;
}
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 10px;
  --control-radius: 8px;
  --popover: var(--card);
  --placeholder: var(--muted-foreground);
  --destructive: var(--error-foreground);
  --top-row-meta: color-mix(in srgb, var(--sidebar-whisper) 55%, transparent);
  --sidebar-prose: color-mix(in srgb, var(--sidebar-whisper) 75%, transparent);
  --sidebar-icon-color: color-mix(in srgb, var(--sidebar-muted-foreground) 60%, var(--sidebar));
  --sidebar-width: 256px;
  --panel-width: 400px;
  --topbar: 52px;
  --grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
}

* { box-sizing: border-box; }
html, body, #app { height: 100%; margin: 0; }
body {
  font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--foreground);
  background: var(--background); background-image: var(--grain); background-size: 256px 256px;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
svg { display: block; }
.i { width: 16px; height: 16px; flex: none; }
.truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.meta { font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; color: var(--top-row-meta); }
.prose { font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; color: var(--sidebar-prose); }
.fact { font-family: var(--font-mono); font-size: 11px; line-height: 16px; font-variant-numeric: tabular-nums; color: var(--muted-foreground); }
.value { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--foreground); }
.micro { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted-foreground); }
/* Facts beside each other: a gap, never a dot. */
.facts { display: flex; gap: 12px; min-width: 0; }
.facts > * { white-space: nowrap; }

/* The agent marks: the catalog svg inline, a shape with no fill of its own in the first ink, the ink switched by
   the side the page draws. A mark with no inks takes the colour of whatever it sits in. */
.mark { flex: none; fill: currentColor; }
.mark text { font-family: var(--font-mono); font-weight: 800; }

/* The frame: sidebar, centre, right panel. The two edges are the only full-height lines on the screen. */
.frame { display: flex; height: 100%; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-width); flex: none; display: flex; flex-direction: column;
  background: var(--sidebar); background-image: var(--grain); background-size: 256px 256px;
  color: var(--sidebar-foreground); border-right: 1px solid var(--sidebar-border);
}
.centre { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.panel { width: var(--panel-width); flex: none; display: flex; flex-direction: column; border-left: 1px solid var(--border); min-height: 0; }

/* The frame row, 52 px: the sidebar toggle and the lockup, no line under it. */
.framerow { height: var(--topbar); flex: none; display: flex; align-items: center; gap: 16px; padding-left: 8px; }
.lockup { height: 14px; width: 51px; color: var(--muted-foreground); transform: translateY(2px); }
.ghosticon {
  width: 28px; height: 28px; flex: none; border-radius: var(--control-radius); display: inline-flex; align-items: center; justify-content: center;
  color: var(--muted-foreground); transition: background-color 150ms, color 150ms;
}
.ghosticon:hover { background: var(--accent); color: var(--foreground); }
.ghosticon[aria-pressed="true"] { background: var(--accent); color: var(--foreground); }
.sidebar .ghosticon { color: var(--sidebar-muted-foreground); }
.sidebar .ghosticon:hover { background: var(--sidebar-row-hover); color: var(--sidebar-foreground); }

/* The sidebar's rows: 36 px, 8 px inset, radius 8, the rest ink, hover in 150 ms. Exactly today's grammar. */
.side { padding: 0 8px; display: flex; flex-direction: column; min-height: 0; flex: 1; }
.fixed { flex: none; display: flex; flex-direction: column; }
.row {
  position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 8px;
  border-radius: var(--control-radius); color: var(--sidebar-row-rest); font-size: 14px; transition: background-color 150ms, color 150ms;
}
.row:hover { background: var(--sidebar-row-hover); color: var(--sidebar-foreground); }
.row > .i { color: var(--sidebar-icon-color); }
.row:hover > .i { color: var(--sidebar-foreground); }
.row .grow { flex: 1; }
.row.pe { padding-right: 32px; }
.rowaction {
  position: absolute; top: 50%; right: 6px; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 8px;
  display: inline-flex; align-items: center; justify-content: center; color: var(--sidebar-foreground); transition: background-color 150ms;
}
.rowaction:hover { background: var(--sidebar-row-hover); }
.switcher { position: relative; }
.chev { transition: transform 150ms; }
.switcher[data-open="true"] .chev { transform: rotate(180deg); }

/* The switcher's menu: the popover surface, the field at its top, one row per project, Add a project at its foot. */
.menu {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 5; border-radius: 12px; overflow: hidden;
  background: color-mix(in srgb, var(--popover) 96%, transparent); border: 1px solid var(--popover-edge); box-shadow: var(--popover-shadow);
  backdrop-filter: blur(8px); color: var(--foreground);
}
.menu .search { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.menu .search .i { color: var(--muted-foreground); }
.menu .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: 13px; color: var(--foreground); }
.menu .search input::placeholder { color: var(--placeholder); }
.menu .list { padding: 4px; display: flex; flex-direction: column; }
.menu .add { padding: 4px; border-top: 1px solid var(--border); }
.option { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; border-radius: var(--control-radius); font-size: 14px; color: var(--foreground); width: 100%; transition: background-color 150ms; }
.option:hover, .option[data-active] { background: var(--accent); }
.option .grow { flex: 1; }
.option > .i { color: var(--muted-foreground); }
.option .glyph { color: var(--project-hue); }
.option .gear { width: 28px; height: 28px; margin-right: -4px; flex: none; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted-foreground); transition: background-color 150ms, color 150ms; }
.option .gear:hover { background: color-mix(in srgb, var(--background) 60%, transparent); color: var(--foreground); }

/* The tiles: three rows in 62 px, one shape for a root, a child and a settled thread. Row one is the project's own
   glyph in its hue, project @ computer, and the status slot on the right, all sans one step under the title; the
   title is the one full line; row three is the agent's mark, the branch glyph and the branch, small and quiet.
   The status slot follows T3: an icon and a word, coloured only for act now (Needs you), in motion (Working, with the
   elapsed time) and broken (Failed); Done is the unseen finish; a resting thread shows its age alone. */
.list { padding-top: 4px; display: flex; flex-direction: column; min-height: 0; overflow: auto; flex: 1; }
.tile {
  display: flex; flex-direction: column; gap: 3px; width: 100%; height: 68px; padding: 8px; border-radius: var(--control-radius);
  color: var(--sidebar-row-rest); transition: background-color 150ms, color 150ms;
}
.tile > * { flex: none; }
.tile:hover { background: var(--sidebar-row-hover); }
.tile[aria-current="true"] { background: var(--sidebar-row-selected); box-shadow: inset 0 0 0 1px var(--sidebar-row-edge); }
.tile[aria-current="true"] .r2 { font-weight: 500; }
.tile .r1 { display: flex; align-items: center; gap: 6px; height: 14px; line-height: 14px; font-size: 11px; color: var(--sidebar-muted-foreground); }
.tile .r1 .pj { display: inline-flex; flex: none; opacity: 0.9; }
.tile .r1 .pj .i { width: 12px; height: 12px; }
.tile .r1 .at { flex: 1; }
.tile .r3 .crab { margin-left: auto; }

/* A thread's status, one reading everywhere a thread shows: a glyph or the crab, a word and a time in one slot, the
   tone colouring it, a resting thread's age left in the row's muted ink. */
.tstatus { flex: none; display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tstatus .i { width: 12px; height: 12px; }
.tstatus[data-tone] { font-weight: 500; }
.tstatus[data-tone="input"] { color: var(--status-input); }
.tstatus[data-tone="working"] { color: var(--status-working); }
.tstatus[data-tone="failed"] { color: var(--status-failed); }
.tstatus[data-tone="done"] { color: var(--status-done); }
.crab { display: block; flex: none; width: 16px; height: 14px; color: var(--status-working); }
.tile .r2 { height: 18px; line-height: 18px; font-size: 14px; color: var(--sidebar-foreground); }
.tile.idle .r2 { color: var(--sidebar-muted-foreground); }
.tile .r3 { display: flex; align-items: center; gap: 5px; height: 14px; line-height: 14px; font-size: 11px; color: var(--sidebar-muted-foreground); }
.tile .r3 .mark { width: 12px; height: 12px; color: var(--sidebar-muted-foreground); }
.tile .r3 .i { width: 12px; height: 12px; color: var(--top-row-meta); }
.tile .r3 .branch { min-width: 0; }

/* The tree: a child list 12 px in with the rail today's spawned rows draw, a tick into the middle of each tile's
   first row. The rail can be turned off in the bar to compare. */
.children { margin-left: 12px; display: flex; flex-direction: column; min-width: 0; }
.railitem { position: relative; padding-left: 4px; }
body[data-rail="1"] .railitem::before { content: ""; position: absolute; top: 0; left: 0; height: 100%; width: 1px; background: var(--sidebar-rail); }
body[data-rail="1"] .railitem:last-child::before { height: 15px; }
body[data-rail="1"] .railitem::after { content: ""; position: absolute; top: 15px; left: 0; height: 1px; width: 4px; background: var(--sidebar-rail); }

/* The first-timer nudge: a card in the tiles' grammar, the tiles' hover fill and selected edge, no shadow; the line
   and the button sit under the title's text, past the glyph. */
.nudge { flex: none; margin-bottom: 8px; padding: 8px 8px 10px; border-radius: var(--control-radius); background: var(--sidebar-row-hover); box-shadow: inset 0 0 0 1px var(--sidebar-row-edge); display: flex; flex-direction: column; gap: 4px; }
.nudge .r1 { display: flex; align-items: center; gap: 6px; height: 20px; font-size: 14px; color: var(--sidebar-foreground); }
.nudge .r1 > .i { width: 14px; height: 14px; color: var(--sidebar-muted-foreground); }
.nudge .r1 .t { flex: 1; min-width: 0; }
.nudge .x { width: 20px; height: 20px; margin-right: -4px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; color: var(--sidebar-muted-foreground); transition: background-color 150ms, color 150ms; }
.nudge .x:hover { background: var(--sidebar-row-hover); color: var(--sidebar-foreground); }
.nudge .x .i { width: 12px; height: 12px; }
.nudge .say { min-height: 28px; font-size: 11px; line-height: 14px; color: var(--sidebar-muted-foreground); }
.nudge .act { padding-top: 6px; }

/* Settled: the app's section row, caps mono, count while shut, chevron. Space over it, no rule. */
.fold { margin-top: 12px; flex: none; }
.fold .row { height: 36px; color: var(--sidebar-muted-foreground); }
.fold .row > * { white-space: nowrap; }
.fold .row .micro { flex: 1; min-width: 0; color: var(--sidebar-muted-foreground); }
.fold .row .chev { color: var(--sidebar-muted-foreground); }
.fold[data-open="false"] .row .chev { transform: rotate(-90deg); }
.fold .settled { display: none; flex-direction: column; }
.fold[data-open="true"] .settled { display: flex; }
.textbtn { font-family: var(--font-mono); font-size: 11px; color: var(--sidebar-muted-foreground); padding: 2px 6px; border-radius: 6px; transition: background-color 150ms, color 150ms; }
.textbtn:hover { background: var(--sidebar-row-hover); color: var(--sidebar-foreground); }
.foot { padding: 8px; flex: none; }
.foot .row { color: var(--sidebar-muted-foreground); }
.foot .row > .i { color: inherit; }

/* The centre header: the mark and the breadcrumb, nothing under it. */
.topbar { height: var(--topbar); flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 20px; }
.crumbs { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; }
.crumbs .up { color: var(--muted-foreground); transition: color 150ms; }
.crumbs .up:hover { color: var(--foreground); }
.crumbs .sep { color: color-mix(in srgb, var(--muted-foreground) 50%, transparent); }
.crumbs .here { font-weight: 500; color: var(--foreground); }
.crumbs .waiting { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); flex: none; }

/* The conversation: the person's turn in a quiet card, the agent's as prose, one foot line of facts. */
.messages { flex: 1; overflow: auto; padding: 8px 16px 24px; display: flex; flex-direction: column; align-items: center; }
.messages > * { width: 100%; max-width: 768px; }
.turns { display: flex; flex-direction: column; gap: 20px; padding: 16px 4px 0; }
.msg.person { display: flex; justify-content: flex-end; }
.msg.person .card { background: var(--accent); border-radius: 16px; padding: 10px 14px; max-width: 85%; font-size: 15px; line-height: 22px; }
.msg.agent { font-size: 15px; line-height: 22.5px; }
.msg.agent p { margin: 0 0 14px; }
.msg.agent p:last-child { margin-bottom: 0; }
.msg.agent code { font-family: var(--font-mono); font-size: 13px; background: var(--accent); border-radius: 6px; padding: 1px 6px; }
.msg.agent.held { color: var(--muted-foreground); }
.turnfoot { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted-foreground); }
.turnfoot .i { width: 14px; height: 14px; }
.kids { display: flex; flex-direction: column; margin-top: 8px; }
.kids .micro { height: 32px; display: flex; align-items: center; padding: 0 8px; }
.kid { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; border-radius: var(--control-radius); width: 100%; transition: background-color 150ms; }
.kid:hover { background: var(--accent); }
.kid .mark { width: 13px; height: 13px; color: var(--muted-foreground); }
.kid .title { flex: 1; }
.kid .where { flex: none; max-width: 220px; font-size: 12px; color: var(--muted-foreground); }
.kid .tstatus { width: 88px; justify-content: flex-end; font-size: 12px; }
.kid .tstatus:not([data-tone]) { color: var(--muted-foreground); }

/* The composer: today's frame, the one boxed thing in the centre. */
.composerwrap { padding: 0 16px 16px; display: flex; justify-content: center; flex: none; }
.shell { width: 100%; max-width: 768px; position: relative; isolation: isolate; }
.host {
  position: relative; z-index: 10; border-radius: 22px; background: var(--surface-raised);
  box-shadow: inset 0 0 0 1px var(--composer-outline), inset 0 1px 0 var(--composer-highlight), var(--composer-shadow);
}
.host .grid { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px; padding: 8px 8px 8px 20px; }
.host .ghost { color: var(--placeholder); font-size: 14px; min-width: 0; }
.host .picks { display: flex; align-items: center; gap: 2px; }
.pick { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: var(--control-radius); font-size: 13px; color: var(--muted-foreground); transition: background-color 150ms, color 150ms; white-space: nowrap; }
.pick:hover { background: var(--accent); color: var(--foreground); }
.pick .mark { width: 16px; height: 16px; color: var(--foreground); }
.pick .i.small { width: 14px; height: 14px; opacity: 0.6; }
.host .actions { display: flex; align-items: center; gap: 4px; }
.host .ghosticon { width: 32px; height: 32px; color: var(--muted-foreground); }
.host .ghosticon .i { width: 18px; height: 18px; }
.send { width: 36px; height: 36px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--foreground) 22%, var(--surface-raised)); color: var(--foreground); }
.strip {
  position: relative; isolation: isolate; width: calc(100% - 44px); margin: -16px auto 0; display: flex; align-items: center; gap: 8px; padding: 20px 8px 4px 4px;
}
.strip::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 0 0 16px 16px; border: 1px solid var(--strip-edge); background: var(--strip-fill);
  -webkit-mask: linear-gradient(to bottom, transparent 0 1rem, black 1rem); mask: linear-gradient(to bottom, transparent 0 1rem, black 1rem);
}
.strip .left { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
.slot7 { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; font-size: 12px; color: var(--muted-foreground); }
.slot7 .i { width: 12px; height: 12px; }
.slot7.mono { font-family: var(--font-mono); }

// ---- icons and marks ----------------------------------------------------------------------

  "circle-check": '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  "message-circle-question": '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  hourglass: '<path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>',

let markSeq = 0;
/** One agent's catalog mark inline, its ids scoped per copy; the initials where the catalog has no mark (Crush). */
function mark(id, cls = "") {
  const m = window.MARKS[id];
  if (!m || !m.svg) {
    const words = (m ? m.name : id).split(/\s+/);

  { glyph: "server", name: "spoo", cores: 4, mem: "7.7 GB", running: 1, cap: 2, state: { button: "Update", why: "your image changed since this computer got it" } },
  { glyph: "server", name: "studio", cores: 8, mem: "32 GB", running: 0, cap: 16, state: { button: "Sign in", why: "needs a sign-in: Codex" } },
];
const CLOUD_SHORT = {
  noroom: { word: "Full", tone: "warning" },
  waiting: { word: "Full", tone: "warning" },
  spend: { word: "At limit", tone: "warning" },
  ready: { word: "Ready" },
  changed: { button: "Update" },
};
function clouds() {
  const k = CLOUD_STATES[S.cloud] ? S.cloud : "noroom";
  const full = k === "noroom" || k === "waiting";
  return [
    { glyph: "cloud", name: "Solari", running: full ? 2 : 1, cap: 2, spent: k === "spend" ? 10 : 2.31, limit: 10, state: Object.assign({ why: CLOUD_STATES[k] }, CLOUD_SHORT[k]) },
    { glyph: "cloud", name: "ASCII", running: 0, cap: 3, spent: 0, limit: 10, state: { word: "Building 3/5", why: "building your image, 3 of 5" } },
  ];
}
const money = (spent, limit) => `$${spent.toFixed(2)}/$${limit}`;
const track = (n, cap) => `<span class="track"><span class="fill" style="width:${cap ? Math.min(100, (n / cap) * 100) : 0}%"></span></span>`;
const meter = (n, cap, label) => `<span class="meter">${track(n, cap)}<span class="value">${esc(label)}</span></span>`;
function stateCell(s) {
  const why = s.why ? ` title="${esc(s.why)}"` : "";
  if (s.button) return `<span class="state"><button class="btn xs"${why}>${esc(s.button)}</button></span>`;
  return `<span class="state"${s.tone ? ` data-tone="${s.tone}"` : ""}${why}>${esc(s.word)}</span>`;
}
const who = r => named(icon(r.glyph), r.name, { tag: r.tag });

/* Both sections share one template, so the cloud's machines meter spans the cores and memory columns and its spend
 * meter sits under threads; the state column and the chevrons share one right edge. The header's first cell names
 * the section, the only section label there is. */
function computersGrid() {
  const computers = `<div class="gl">
    ${head([["Computer"], ["Cores", "num"], ["Memory", "num"], ["Threads"]])}
    ${COMPUTERS.map(r => `<div class="gr">${who(r)}<span class="value num">${r.cores}</span><span class="value num">${esc(r.mem)}</span>${meter(r.running, r.cap, `${r.running}/${r.cap}`)}${stateCell(r.state)}${icon("chevron-right", "chev")}</div>`).join("")}
  </div>`;
  const cloud = `<div class="gl">
    ${head([["Cloud"], ["Machines", "wide"], ["Spend today", "cloud-spend"]])}
    ${clouds().map(r => `<div class="gr">${who(r)}<span class="wide">${meter(r.running, r.cap, `${r.running}/${r.cap}`)}</span><span class="cloud-spend">${meter(r.spent, r.limit, money(r.spent, r.limit))}</span>${stateCell(r.state)}${icon("chevron-right", "chev")}</div>`).join("")}
  </div>`;
  return [computers, cloud];
}
function computersLedger() {
  const row = (r, spec, load) => `<div class="lr"><span class="who"><span class="tilebox">${icon(r.glyph)}</span><span class="words"><span class="name truncate">${esc(r.name)}${r.tag ? `<span class="tag">${esc(r.tag)}</span>` : ""}</span><span class="spec truncate">${esc(spec)}</span></span></span><span class="load">${track(r.running, r.cap)}<span class="n">${esc(load)}</span></span>${stateCell(r.state)}${icon("chevron-right", "chev")}</div>`;
  const computers = `<div class="ledger">${COMPUTERS.map(r => row(r, `${r.cores} cores, ${r.mem}`, `${r.running} of ${r.cap} threads`)).join("")}</div>`;
  const cloud = `<div class="ledger">${clouds().map(r => row(r, `$${r.spent.toFixed(2)} of $${r.limit} today`, `${r.running} of ${r.cap} machines`)).join("")}</div>`;
  return [computers, cloud];
}
function computersPage() {
  const [computers, cloud] = S.list === "B" ? computersLedger() : computersGrid();
  const one = card("", computers, { under: addBtn("Add a computer") });
  const two = card(S.list === "B" ? "Cloud" : "", cloud, { under: addBtn("Add a cloud", "", ' data-screen="addcloud"') });
  return settingsPage("", "Computers", `The computers your threads run on, and the clouds that lend them machines. ${MAC} is the first one.`, one + two);
}

const brand = id => `<svg class="mark brand" viewBox="0 0 24 24" style="color:${BRANDS[id].hue}" aria-hidden="true"><path fill="currentColor" d="${BRANDS[id].d}"/></svg>`;

/* The settings grid grammar every list on these pages shares: a header row whose first cell names the section, rows
 * with a glyph frame and a sans name, a quiet note under the name where the row has one, numbers right-aligned in
 * mono, words in muted sans. */
const head = cells => `<div class="gh">${cells.map(([w, cls = ""]) => `<span class="micro ${cls}">${w}</span>`).join("")}</div>`;
const label = w => `<div class="gh solo"><span class="micro">${w}</span></div>`;
const grid = (cls, headers, rows) => `<div class="gl ${cls}">${head(headers)}${rows.join("")}</div>`;
const named = (glyph, name, { note = "", tag = "", mono = false } = {}) => `<span class="who"><span class="tilebox">${glyph}</span><span class="words"><span class="name truncate${mono ? " mono" : ""}">${esc(name)}${tag ? `<span class="tag">${esc(tag)}</span>` : ""}</span>${note ? `<span class="note truncate" title="${esc(note)}">${esc(note)}</span>` : ""}</span></span>`;
const num = v => `<span class="value num">${esc(v)}</span>`;
const word = w => `<span class="word truncate">${esc(w)}</span>`;
/** Every Add in the prototype: the app's outline keycap with the plus before its label. */
const addBtn = (text, cls = "", attrs = "") => `<button class="btn ${cls}"${attrs}>${icon("plus")}${text}</button>`;

function imagePage() {
  const path = card("", line(`<span class="value">~/.wsp/wsp-image.toml</span>`, `<button class="btn xs">${icon("file")}Open file</button>`));
  const row = (glyph, name, cells, opts = {}, cls = "") => `<div class="gr ${cls}">${named(glyph, name, opts)}${cells.join("")}</div>`;
  const agents = card("", grid("tight img", [["Agents"], ["Version", "num"], ["Source"]], [
    row(mark("claude"), "Claude Code", [num("2.1.283"), word("catalog")]),
    row(mark("codex"), "Codex", [num("0.155.1"), word("catalog")]),
  ]), { under: addBtn("Add a row") });
  const clis = card("", grid("tight img", [["CLIs"], ["Version", "num"], ["Source"]], [
    row(brand("node"), "node", [num("22"), word("brew")]),
    row(brand("github"), "gh", [num("2.81.0"), word("brew")]),
    row(brand("cloudflare"), "wrangler", [num("4.42.0"), word("npm")]),
    row(icon("terminal"), "bat", [num("0.25.0"), word("brew")]),
    row(icon("terminal"), "just", [num("1.40.0"), word("script")], { note: "its own install and check" }),
    row(icon("terminal"), "bat-extras", [num(""), word("")], { note: "left out: no Linux build" }, "left"),
  ]), { under: addBtn("Add a row") });
  const mcp = card("", grid("tight img", [["MCP servers"], [""], ["Where"]], [
    row(brand("linear"), "linear", [num(""), word("travels")]),
    row(brand("github"), "github", [num(""), word(`stays on ${MAC}`)]),
  ]), { under: addBtn("Add a row") });
  const skills = card("", grid("tight img", [["Skills"], ["Folders", "num"], ["Where"]], [
    row(icon("folder"), "~/.claude/skills", [num("71"), word("travels")], { mono: true }),
    row(icon("folder"), "~/.codex/skills", [num("4"), word("travels")], { mono: true }),
    row(icon("folder"), "~/.agents/skills", [num("12"), word("travels")], { mono: true }),
  ]), { under: addBtn("Add a folder") });
  const read = `<p class="quiet">Last read 26 Sep, when wrangler was added.</p>`;
  const machines = card("", grid("tight img", [["Machines"], [""], ["Image", "num"]], [
    row(icon("laptop"), MAC, [num(""), stateCell({ word: "Source" })]),
    row(icon("server"), "spoo", [num(""), stateCell({ button: "Update", why: "got the file built 24 Sep" })]),
    row(icon("server"), "studio", [num(""), stateCell({ word: "Current" })]),
    row(icon("cloud"), "Solari", [num(""), stateCell({ button: "Update", why: "got the file built 24 Sep" })]),
    row(icon("cloud"), "ASCII", [num(""), stateCell({ word: "Building 3/5", why: "building your image, 3 of 5" })]),
  ]), { lede: "Which of your computers and clouds have this file, and which got an older one." });
  return settingsPage("", "Image", "Your setup as one file: agents, CLIs, MCP servers and skills. Every computer and cloud you add gets it.", path + agents + clis + mcp + skills + read + machines);
}

/** One computer's or cloud's own page: what needs a sign-in there in the image's groups, its limits, its image, the
 * threads running there, and the way out. `id` is cloud (Solari) or computer (spoo). */
function placeData(id) {
  const account = `<button class="btn xs">Use a different account here</button>`;
  const key = `<input class="field paste" placeholder="paste a Linear API key"><button class="btn xs">Save</button>`;
  if (id === "cloud") {
    const k = CLOUD_STATES[S.cloud] ? S.cloud : "noroom";
    return {
      name: "Solari", state: Object.assign({}, CLOUD_SHORT[k]), sentence: CLOUD_STATES[k],
      agents: [
        { glyph: mark("claude"), name: "Claude Code", version: "2.1.283", note: "Signed in as zingzy (default)", act: account },
        { glyph: mark("codex"), name: "Codex", version: "0.155.1", note: "Can't run here: its sign-in can't be shared" },
      ],
      clis: [{ glyph: brand("github"), name: "gh", version: "2.81.0", note: "Signed in as Zingzy (default)", act: account }],
      mcp: [{ glyph: brand("linear"), name: "linear", note: "Needs a sign-in", act: key }],
      limits: [["Machines at once", "your plan takes 2", stepper(3)], ["Spend per day", "", `<input class="field money" value="$10">`]],
      image: { note: "built 26 Sep, skipped bat-extras and just", state: { button: "Update", why: "your image changed since Solari got it" } },
      threads: THREADS[0].children.filter(c => c.where === "Solari"),
      remove: ["Remove Solari", "Deletes every machine wsp made there and forgets the key."],
    };
  }
  return {
    name: "spoo", state: { button: "Update" }, sentence: "your image changed since this computer got it",
    agents: [
      { glyph: mark("claude"), name: "Claude Code", version: "2.1.283", note: "Signed in as zingzy (default)", act: account },
      { glyph: mark("codex"), name: "Codex", version: "0.155.1", note: "Signed in as zingzy", act: account },
    ],
    clis: [{ glyph: brand("github"), name: "gh", version: "2.81.0", note: "Signed in as Zingzy (default)", act: account }],
    mcp: [{ glyph: brand("linear"), name: "linear", note: "Needs a sign-in", act: key }],
    limits: [["Threads at once", "4 cores, 7.7 GB", stepper(2)]],
    image: { note: "built 24 Sep; the file changed on 26 Sep", state: { button: "Update", why: "your image changed since this computer got it" } },
    threads: THREADS.filter(t => t.where === "spoo"),
    remove: ["Remove spoo", `wsp comes off spoo and its threads' records leave ${MAC}. Your files there stay.`],
  };
}
function placePage(id) {
  const p = placeData(id);
  const signin = (name, rows) => rows.length ? card("", grid("tight signin", rows.some(r => r.version) ? [[name], ["Version", "num"]] : [[name]], rows.map(r => `<div class="gr">${named(r.glyph, r.name, { note: r.note })}${num(r.version || "")}<span class="act">${r.act || ""}</span></div>`))) : "";
  const limits = card("", label("Limits") + p.limits.map(([l, note, control]) => `<div class="line"><span class="label"><span>${esc(l)}</span>${note ? `<span class="note">${esc(note)}</span>` : ""}</span><span class="right">${control}</span></div>`).join(""));
  const image = card("", grid("tight signin", [["Image"]], [`<div class="gr">${named(icon("file"), "Your image", { note: p.image.note })}${num("")}${stateCell(p.image.state)}</div>`]));
  const threads = card("", label("Threads running here") + p.threads.map(t => threadRow(t, t.project)).join(""));
  const remove = card("", `<div class="line tall"><span class="label"><span>${esc(p.remove[0])}</span><span class="note">${esc(p.remove[1])}</span></span><span class="right"><button class="btn xs danger">Remove</button></span></div>`);
  const crumbs = `<div class="crumbs"><button class="up" data-screen="computers">Computers</button><span class="sep">/</span><span>${esc(p.name)}</span></div>`;
  const headline = `<span class="statehead">${stateCell(p.state)}<span>${esc(p.sentence)}</span></span>`;
  return settingsPage(crumbs, p.name, headline, signin("Agents", p.agents) + signin("CLIs", p.clis) + signin("MCP servers", p.mcp) + limits + image + threads + remove);
}
function addCloudSheet() {
  const refusal = S.refused
    ? `<p class="refusal">Solari refused this key. <span class="fix">Check it on getsolari.com and paste it again.</span></p>`
    : `<p class="refusal"><span class="held">Builds your image on Solari in the background. The row shows progress.</span></p>`;
  return `<div class="scrim"><div class="sheet" role="dialog" aria-label="Add a cloud">
    <div class="shead"><h1>Add a cloud</h1></div>
    <div class="body">
      ${line("Provider", `<span class="segmentctl"><button aria-pressed="true">${icon("cloud")}Solari</button><button aria-pressed="false">${icon("cloud")}ASCII</button></span>`)}
      ${line("Key", `<input class="field paste" type="password" value="${S.refused ? "slr_live_9f2c" : ""}" placeholder="paste your Solari key">`)}
      ${line("Machines at once", stepper(3))}
      ${line("Spend per day", `<input class="field money" value="$10">`)}
    </div>
    ${refusal}
    <div class="sfoot"><button class="btn" data-screen="computers">Cancel</button>${addBtn("Add", "primary", S.refused ? "" : " disabled")}</div>
  </div></div>`;
}

// ---- the prototype's own bar ----------------------------------------------------------------
function bar() {
  const sel = (k, opts) => `<label>${k}<select data-q="${k}">${opts.map(([v, n]) => `<option value="${v}" ${S[k] === v ? "selected" : ""}>${n}</option>`).join("")}</select></label>`;
  const chk = (k, n) => `<label><input type="checkbox" data-q="${k}" ${S[k] ? "checked" : ""}>${n}</label>`;
  return [
    sel("screen", [["threads", "threads"], ["computers", "computers"], ["cloud", "cloud page"], ["computer", "computer page"], ["image", "image"], ["addcloud", "add cloud"]]),
    sel("theme", [["graphite", "graphite"], ["paper", "paper"]]),
    S.screen === "threads" ? sel("picker", [["", "pickers shut"], ["projects", "projects open"], ["computers", "computers open"]]) : "",
    S.screen === "threads" ? chk("settled", "settled open") : "",
    S.screen === "threads" ? chk("rail", "rail") : "",
    S.screen === "threads" ? sel("nudge", [["off", "nudge: off"], ["first", "nudge: first run"], ["waiting", "nudge: waiting"]]) : "",
    S.screen === "computers" ? sel("cloud", Object.keys(CLOUD_STATES).map(k => [k, k])) : "",
    S.screen === "computers" ? sel("list", [["A", "A"], ["B", "B"]]) : "",
    S.screen === "addcloud" ? chk("refused", "key refused") : "",
    sel("pane", [["sidebar", "phone: sidebar"], ["main", "phone: main"]]),
  ].join("");
}

// ---- render ----------------------------------------------------------------------------------
function render() {
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.classList.toggle("dark", S.theme !== "paper");
  document.body.dataset.pane = S.pane;
  document.body.dataset.bar = S.bar ? "1" : "0";
  document.body.dataset.rail = S.rail ? "1" : "0";
  let html = "";
  if (S.screen === "threads") html = `<div class="frame">${threadSidebar()}${threadCentre()}${agentsPanel()}</div>`;
  else if (S.screen === "computers" || S.screen === "addcloud") html = `<div class="frame">${settingsSidebar(S.screen)}${computersPage()}</div>${S.screen === "addcloud" ? addCloudSheet() : ""}`;
  else if (S.screen === "cloud" || S.screen === "computer") html = `<div class="frame">${settingsSidebar(S.screen)}${placePage(S.screen)}</div>`;
  else if (S.screen === "image") html = `<div class="frame">${settingsSidebar("image")}${imagePage()}</div>`;
  document.getElementById("app").innerHTML = html;
  document.getElementById("bar").innerHTML = bar();
  startCrabs();

  document.querySelectorAll("[data-open]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); go({ open: el.dataset.open, pane: "main" }); }));
  document.querySelectorAll("[data-screen]").forEach(el => el.addEventListener("click", e => { e.stopPropagation(); go({ screen: el.dataset.screen, pane: el.dataset.screen === "threads" ? "sidebar" : "main" }); }));
  document.querySelectorAll("[data-toggle]").forEach(el => el.addEventListener("click", () => go({ [el.dataset.toggle]: S[el.dataset.toggle] ? "0" : "1" })));
  document.querySelectorAll("[data-picker]").forEach(el => el.addEventListener("click", () => go({ picker: S.picker === el.dataset.picker ? null : el.dataset.picker })));
  document.querySelectorAll(".bar [data-q]").forEach(el => el.addEventListener("change", () => go({ [el.dataset.q]: el.type === "checkbox" ? (el.checked ? "1" : "0") : el.value })));
}
render();
</script>
</body>
</html>
