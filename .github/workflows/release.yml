name: release

# A pushed v1.2.3 tag is the whole release: the draft with its notes, the four
# daemon binaries, the mac disk image, the linux AppImage, the command line
# package on npm through trusted publishing, and the draft turned into a
# release once every part landed. Every bundle also goes up under a name no
# version moves, which is what releases/latest/download serves and what the
# site links. Run by hand it is a dry run: the daemon binaries are built and
# uploaded as artifacts and the command line package is staged with them, and
# nothing is drafted, attached or published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the daemon binaries and stage the command line package with them; publish nothing
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.9.0"

jobs:
  daemon:
    name: Daemon ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            daemon/target
          key: daemon-release-${{ matrix.target }}-${{ hashFiles('daemon/Cargo.lock', 'daemon/rust-toolchain.toml') }}
          restore-keys: |
            daemon-release-${{ matrix.target }}-
      # The two Linux binaries are static musl builds cross-compiled on one runner; ring carries C, and zig is the
      # one C toolchain that targets both chips from it. The wheel brings zig as a python module, which cargo-zigbuild
      # finds through the python3 on PATH, so both go into the runner's own python rather than a tool's venv.
      - name: cargo-zigbuild and zig for the musl targets
        if: matrix.zig
        run: |
          pip3 install --user --break-system-packages cargo-zigbuild
          python3 -m ziglang version
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --target "$TARGET" -p wsp-daemon-bin
          else
            cargo build --release --target "$TARGET" -p wsp-daemon-bin
          fi
          cp "target/$TARGET/release/wsp-daemon" "wsp-daemon-$TARGET"
          ls -l "wsp-daemon-$TARGET"
          file "wsp-daemon-$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: wsp-daemon-${{ matrix.target }}
          path: daemon/wsp-daemon-${{ matrix.target }}
          if-no-files-found: error

  draft:
    name: Draft release
    if: ${{ !inputs.dry_run && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The tag and the manifests say the same version
        id: version
        run: |
          version="$(node packages/wspx/scripts/tag-version.mjs "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The right-click Open paragraph is for bundles no identity signed, and the certificate is what signs them.
      - name: Write the notes
        run: node packages/wspx/scripts/release-notes.mjs "$GITHUB_REF_NAME" ${{ secrets.CSC_LINK != '' && '--signed' || '' }} > notes.md
      - name: Open the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          case "$draft" in
            none) gh release create "$GITHUB_REF_NAME" --draft --title "wsp $VERSION" --notes-file notes.md ;;
            true) gh release edit "$GITHUB_REF_NAME" --title "wsp $VERSION" --notes-file notes.md ;;
            *) echo "the release on $GITHUB_REF_NAME is already published; nothing here rewrites it"; exit 1 ;;
          esac

  mac:
    name: macOS disk image
    needs: [draft, daemon]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every asset name this job works with comes from the one formatter, so nothing here spells one.
      - name: The names this release's assets carry
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: node packages/wspx/scripts/bundle-env.mjs "$VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: wsp-daemon-*
          path: daemon-bins
      - name: The daemon binaries, where the app's build stages them
        run: node packages/wspx/scripts/daemon-binary.mjs --from-artifacts daemon-bins
      # The certificate and the Apple account that sign and notarize the bundles reach this step alone. Unset, each
      # arrives empty and the build signs ad hoc; electron-builder takes an empty CSC_LINK for a certificate and fails
      # importing it, so that one is unset, while the other four read empty as unset.
      - name: Build the bundles
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK; fi
          pnpm --filter @wsp/desktop run build:mac
      # The screen smoke measures a real Mac's window and fails on a hosted runner's display; it runs in the merge
      # gate on a Mac. Here each bundle's signature and the packaged tree are checked without a screen, and with a
      # certificate the check insists on a notarized, stapled bundle.
      - name: Check the packaged trees
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: pnpm --filter @wsp/desktop exec vitest run --minWorkers=1 --maxWorkers=1 test/signing.test.ts
      - name: Name the disk image after the release, and copy it to the name that never moves
        run: |
          shopt -s nullglob
          set -- apps/desktop/dist/*.dmg
          if [ "$#" -ne 1 ]; then
            echo "expected one dmg in apps/desktop/dist, found $#"
            exit 1
          fi
          mv "$1" "$MAC_DMG"
          cp "$MAC_DMG" "$MAC_STABLE"
      - name: Attach them to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$MAC_DMG" "$MAC_STABLE" --clobber

  linux:
    name: Linux AppImage
    needs: [draft, daemon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The names this release's assets carry
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: node packages/wspx/scripts/bundle-env.mjs "$VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: wsp-daemon-*
          path: daemon-bins
      - name: The daemon binaries, where the app's build stages them
        run: node packages/wspx/scripts/daemon-binary.mjs --from-artifacts daemon-bins
      - run: pnpm --filter @wsp/desktop run build:linux
      - name: Name the AppImage after the release, and copy it to the name that never moves
        run: |
          shopt -s nullglob
          set -- apps/desktop/dist/*.AppImage
          if [ "$#" -ne 1 ]; then
            echo "expected one AppImage in apps/desktop/dist, found $#"
            exit 1
          fi
          mv "$1" "$APPIMAGE"
          cp "$APPIMAGE" "$APPIMAGE_STABLE"
      - name: Attach them to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$APPIMAGE" "$APPIMAGE_STABLE" --clobber

  npm:
    name: Command line package on npm
    needs: [draft, daemon]
    # On a dry run the draft is skipped and this still runs, to stage the package with the four binaries.
    if: ${{ !cancelled() && needs.daemon.result == 'success' && (inputs.dry_run || needs.draft.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing: the package on npm trusts this repository and this
      # workflow file, so the runner's identity token is the credential and no
      # npm token exists anywhere. It needs an npm newer than node 22 ships.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: wsp-daemon-*
          path: daemon-bins
      - name: The daemon binaries, where the command's build stages them
        run: node packages/wspx/scripts/daemon-binary.mjs --from-artifacts daemon-bins
      - run: pnpm -r --filter '!./apps/www' --filter '!./apps/docs' --filter '!@wsp/desktop' build
      - name: Every target the host names is in the package
        run: node packages/wspx/scripts/daemon-binary.mjs --check
      - name: Attach the binaries to the draft
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" daemon-bins/*/wsp-daemon-* --clobber
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: pnpm --filter @zingzy/wsp exec npm publish --provenance --access public

  publish:
    name: Publish the release
    needs: [draft, mac, linux, npm]
    runs-on: ubuntu-latest
    steps:
      - name: Turn the draft into a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
