name: release

# A pushed v1.2.3 tag is the whole release: the draft with its notes, the mac
# zips, the linux AppImage, the command line package on npm through trusted
# publishing, and the draft turned into a release once every part landed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.9.0"

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The tag and the manifests say the same version
        id: version
        run: |
          version="$(node packages/wspx/scripts/tag-version.mjs "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Write the notes
        run: node packages/wspx/scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
      - name: Open the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          case "$draft" in
            none) gh release create "$GITHUB_REF_NAME" --draft --title "wsp $VERSION" --notes-file notes.md ;;
            true) gh release edit "$GITHUB_REF_NAME" --title "wsp $VERSION" --notes-file notes.md ;;
            *) echo "the release on $GITHUB_REF_NAME is already published; nothing here rewrites it"; exit 1 ;;
          esac

  mac:
    name: macOS bundles
    needs: draft
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wsp/desktop run build:mac
      # The screen smoke measures a real Mac's window and fails on a hosted runner's display; it runs in the merge
      # gate on a Mac. Here the packaged tree is checked without a screen.
      - name: Check the packaged trees
        run: pnpm --filter @wsp/desktop exec vitest run --minWorkers=1 --maxWorkers=1 test/pty-native.test.ts
      - name: Zip each bundle
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          ditto -c -k --keepParent apps/desktop/dist/mac-arm64/wsp.app "wsp-$VERSION-mac-arm64.zip"
          ditto -c -k --keepParent apps/desktop/dist/mac/wsp.app "wsp-$VERSION-mac-x64.zip"
      - name: Attach them to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: gh release upload "$GITHUB_REF_NAME" "wsp-$VERSION-mac-arm64.zip" "wsp-$VERSION-mac-x64.zip" --clobber

  linux:
    name: Linux AppImage
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wsp/desktop run build:linux
      - name: Name the AppImage after the release
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          shopt -s nullglob
          set -- apps/desktop/dist/*.AppImage
          if [ "$#" -ne 1 ]; then
            echo "expected one AppImage in apps/desktop/dist, found $#"
            exit 1
          fi
          mv "$1" "wsp-$VERSION.AppImage"
      - name: Attach it to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: gh release upload "$GITHUB_REF_NAME" "wsp-$VERSION.AppImage" --clobber

  npm:
    name: Command line package on npm
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing: the package on npm trusts this repository and this
      # workflow file, so the runner's identity token is the credential and no
      # npm token exists anywhere. It needs an npm newer than node 22 ships.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '!./apps/www' --filter '!./apps/docs' --filter '!@wsp/desktop' build
      - name: Publish
        run: pnpm --filter @zingzy/wsp exec npm publish --provenance --access public

  publish:
    name: Publish the release
    needs: [draft, mac, linux, npm]
    runs-on: ubuntu-latest
    steps:
      - name: Turn the draft into a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
