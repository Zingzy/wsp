# SPDX-License-Identifier: AGPL-3.0-only
name: daemon

# The Rust daemon under daemon/ has its own gate, run on every pull request
# and every push to main that touches it or the wire it is held to: format,
# lints as errors, the tests, the release build, the static musl build, and
# the node wire suite driven against the built binary, which is the contract
# every daemon speaking the protocol is held to. It sits in its own workflow
# so the paths filter leaves the node jobs in ci.yml exactly as they are.
on:
  pull_request:
    paths:
      - "daemon/**"
      - "packages/daemon/**"
      - "packages/protocol/**"
      - ".github/workflows/daemon.yml"
  push:
    branches:
      - main
    paths:
      - "daemon/**"
      - "packages/daemon/**"
      - "packages/protocol/**"
      - ".github/workflows/daemon.yml"

permissions:
  contents: read

concurrency:
  group: daemon-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.9.0"

jobs:
  daemon-rust:
    name: Format, lint, test, build, wire suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            daemon/target
          key: daemon-rust-${{ runner.os }}-${{ hashFiles('daemon/Cargo.lock', 'daemon/rust-toolchain.toml') }}
          restore-keys: |
            daemon-rust-${{ runner.os }}-
      - name: The one C library the daemon links
        # libcontainer applies the seccomp filter through libseccomp; the build links its archive statically,
        # from a directory of its own so the musl link never sees glibc's libc.a beside it.
        run: |
          sudo apt-get install -y --no-install-recommends libseccomp-dev
          ./scripts/libseccomp-archive.sh
      - name: Format
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release
      - name: C compiler for the musl target, and libseccomp built against musl
        # ring carries C, and its build looks for x86_64-linux-musl-gcc, which musl-tools provides. The static
        # binary links a libseccomp built against musl, since the distribution's archive is glibc's.
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools gperf
          ./scripts/libseccomp-archive.sh musl
      - name: Static musl build
        run: LIBSECCOMP_LIB_PATH=$PWD/target/libseccomp/musl cargo build --release --target x86_64-unknown-linux-musl
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # Staged as the command stages it, which refuses a Linux binary that names a shared library: a static-pie
      # binary loads none, so such a name is a call to address zero at its first use.
      - name: The static binary staged
        working-directory: .
        run: node packages/wspx/scripts/daemon-binary.mjs --triple x86_64-unknown-linux-musl
      # The wire suite as the contract: the same files that drive the node daemon in the ci gate drive this binary.
      - name: Wire suite against the binary
        working-directory: .
        env:
          WSP_DAEMON_BIN: daemon/target/release/wsp-daemon
        run: pnpm exec vitest run --minWorkers=1 --maxWorkers=1 packages/daemon/test/daemon-ws.test.ts packages/daemon/test/daemon-ops.test.ts packages/daemon/test/exec.test.ts packages/daemon/test/fs-git-ops.test.ts packages/daemon/test/relay.test.ts packages/daemon/test/place-link.test.ts packages/daemon/test/local-urls.test.ts packages/daemon/test/harness.test.ts

  # The two Linux daemons this head would ship, uploaded on every run so staging one on another computer is a
  # download from the run that built the head instead of a release dispatched by hand. The build and the artifact
  # names are the release job's, so daemon-binary.mjs reads an artifact from either the same way. Each binary is
  # staged through that script before it goes up, so the refusal of a musl binary that names a shared library runs
  # on the bytes uploaded, and the sha256 travels beside it.
  daemon-artifacts:
    name: Linux daemon ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            daemon/target
          key: daemon-artifacts-${{ matrix.target }}-${{ hashFiles('daemon/Cargo.lock', 'daemon/rust-toolchain.toml') }}
          restore-keys: |
            daemon-artifacts-${{ matrix.target }}-
      # Each binary is built on its own chip's runner, so the static link needs no cross toolchain.
      - name: C compiler for the musl target, and libseccomp built against musl
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools gperf
          ./scripts/libseccomp-archive.sh musl
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          LIBSECCOMP_LIB_PATH="$PWD/target/libseccomp/musl" cargo build --release --target "$TARGET" -p wsp-daemon-bin
          cp "target/$TARGET/release/wsp-daemon" "wsp-daemon-$TARGET"
          ls -l "wsp-daemon-$TARGET"
          file "wsp-daemon-$TARGET"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The binary staged, as the command stages it
        working-directory: .
        env:
          TARGET: ${{ matrix.target }}
        run: node packages/wspx/scripts/daemon-binary.mjs --triple "$TARGET" --from "daemon/wsp-daemon-$TARGET"
      - name: Its sha256, beside it
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sha256sum "wsp-daemon-$TARGET" > "wsp-daemon-$TARGET.sha256"
          cat "wsp-daemon-$TARGET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wsp-daemon-${{ matrix.target }}
          path: |
            daemon/wsp-daemon-${{ matrix.target }}
            daemon/wsp-daemon-${{ matrix.target }}.sha256
          if-no-files-found: error
