name: diag-clean

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: diag-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    name: server-tools 30 times on Linux, run ${{ matrix.n }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.9.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '!./apps/www' --filter '!./apps/docs' --filter '!@wsp/desktop' --filter '!@wsp/web' --filter '!@zingzy/wsp' build
      - name: the file 30 times at 2 workers, under four busy loops
        run: |
          for i in 1 2 3 4; do yes > /dev/null & done
          fails=0
          for i in $(seq 1 30); do
            if ! pnpm exec vitest run --minWorkers=1 --maxWorkers=2 packages/host/test/server-tools.test.ts > run.log 2>&1; then fails=$((fails+1)); echo "=== file run $i FAILED"; fi
            echo "run $i load $(cut -d' ' -f1-3 /proc/loadavg) $(grep -E 'Tests |Errors' run.log | tr -s ' ' | tr '\n' ' ')"
            grep -E "AssertionError|×" run.log | cut -c1-2000
          done
          kill $(jobs -p) || true
          echo "FAILURES $fails"
          [ "$fails" = 0 ]
