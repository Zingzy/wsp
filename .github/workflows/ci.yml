name: diag

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    name: server-tools on Linux, run ${{ matrix.n }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.9.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '!./apps/www' --filter '!./apps/docs' --filter '!@wsp/desktop' --filter '!@wsp/web' --filter '!@zingzy/wsp' build
      - name: facts
        run: |
          bash --version | head -1; node -v; nproc; cat /proc/sys/kernel/pid_max; ulimit -u; ulimit -n
          setsid bash -c 'set -m; sleep 3 & echo "shell $$ pgid $(ps -o pgid= -p $$) job $! jobpgid $(ps -o pgid= -p $!)"' < /dev/null
      - name: the case 40 times, then the file 10 times, under four busy loops
        run: |
          for i in 1 2 3 4; do yes > /dev/null & done
          fails=0
          for i in $(seq 1 40); do
            if ! pnpm exec vitest run --minWorkers=1 --maxWorkers=2 packages/host/test/server-tools.test.ts -t "starts at most four servers" > run.log 2>&1; then fails=$((fails+1)); echo "=== case run $i FAILED"; fi
            grep -E "Tests |AssertionError|DEBUG-" run.log | cut -c1-8000
          done
          for i in $(seq 1 10); do
            if ! pnpm exec vitest run --minWorkers=1 --maxWorkers=2 packages/host/test/server-tools.test.ts > run.log 2>&1; then fails=$((fails+1)); echo "=== file run $i FAILED"; fi
            grep -E "Tests |AssertionError|DEBUG-|×" run.log | cut -c1-8000
          done
          kill $(jobs -p) || true
          echo "FAILURES $fails"
