name: ci

# Every pull request and every push to main runs what the merge gate runs on a
# clean machine: the daemon binary this runner runs, then install, build every
# package but the landing site and the desktop bundle, the unit suite, and the
# type check per package. The Chromium cases and the Electron smoke need a
# screen and stay behind their own flags.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.9.0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Install, build, test, types
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The host spawns the daemon for this computer's own workspace and the command line package carries it, so the
      # build and the suite both want the one Linux binary this runner runs before anything of node's is built.
      - name: Toolchain from rust-toolchain.toml
        working-directory: daemon
        run: |
          rustup toolchain install
          rustup show
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            daemon/target
          key: daemon-rust-${{ runner.os }}-${{ hashFiles('daemon/Cargo.lock', 'daemon/rust-toolchain.toml') }}
          restore-keys: |
            daemon-rust-${{ runner.os }}-
      # ring carries C, which musl-tools compiles for the musl target; libcontainer links libseccomp statically, and
      # the archive has to be one built against musl, so the script builds it from its pinned release first.
      - name: C compiler for the musl target, and libseccomp built against musl
        working-directory: daemon
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools gperf
          ./scripts/libseccomp-archive.sh musl
      - name: The daemon this runner runs
        working-directory: daemon
        run: LIBSECCOMP_LIB_PATH=$PWD/target/libseccomp/musl cargo build --locked --release --target x86_64-unknown-linux-musl -p wsp-daemon-bin
      - run: node packages/wspx/scripts/daemon-binary.mjs --triple x86_64-unknown-linux-musl
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r --filter '!./apps/www' --filter '!./apps/docs' --filter '!@wsp/desktop' build
      - name: Tests
        # The step above staged this runner's daemon binary, so the case that reads its version against the
        # protocol's runs here rather than skipping: a checkout with no binary staged is a developer's machine.
        env:
          WSP_REQUIRE_DAEMON: "1"
        run: pnpm exec vitest run --minWorkers=1 --maxWorkers=2
      - name: Types
        run: pnpm -r --filter '!./apps/www' --filter '!./apps/docs' exec tsc --noEmit
